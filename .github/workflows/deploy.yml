name: deploy

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build SPA + worker
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}

      - name: Apply migrations + deploy production (push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx wrangler d1 migrations apply nomad-prod --env production --remote
          npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply migrations + deploy preview (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          npx wrangler d1 migrations apply nomad-preview --env preview --remote
          npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
